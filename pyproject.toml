[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muesli-win"
version = "1.1.0"
description = "Local-first dictation and meeting transcription for Windows"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.scripts]
muesli-cli = "muesli_win.cli.main:main"

[project.gui-scripts]
muesli = "muesli_win.app:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["muesli_win*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, a bare `pytest` (as opposed to `python -m pytest`) does not put
# the repo root on sys.path and every test fails to import muesli_win.
pythonpath = ["."]
addopts = "-q --timeout=120"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# A gesture sequence reads better on one line: m.key_down(t); m.key_up(t+80)
"tests/*" = ["E702"]
